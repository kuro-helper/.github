name: Nuxt Build

on:
  workflow_call:
    inputs:
      upload_output:
        description: 'If true, upload .output as an artifact for deploy'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: main/yarn.lock

      - name: Install dependencies
        working-directory: main
        run: yarn install --frozen-lockfile

      - name: Run lint
        working-directory: main
        run: yarn lint

      - name: Build
        working-directory: main
        run: |
          set -euo pipefail
          # CI does not inject API config; runtime .env is provided on VPS
          npx nuxt build

      - name: Upload build output
        if: ${{ inputs.upload_output }}
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-output
          path: main/.output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
