name: Go Build

on:
  workflow_call:
    inputs:
      use_kurohelperservice:
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: main

      - name: Checkout kurohelper-service
        if: ${{ inputs.use_kurohelperservice != '' }} 
        uses: actions/checkout@v5
        with:
          repository: kuro-helper/kurohelper-service
          ref: ${{ inputs.use_kurohelperservice }}
          path: kurohelperservice

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: main/go.sum

      - name: Link Local Dependencies
        run: |
            cd main
            if [ -d "../kurohelperservice" ]; then
              echo "Linking kurohelperservice to ../kurohelperservice"
              go mod edit -replace kurohelperservice=../kurohelperservice
            fi
            
            echo "Updated go.mod content:"
            cat go.mod

      - name: Build
        run: |
          cd main
          go build -v ./...

      # - name: Test
      #   run: go test -v ./...