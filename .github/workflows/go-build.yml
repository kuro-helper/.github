name: Go Build

on:
  workflow_call:
    inputs:
      use_kurohelperservice:
        type: string
        default: ''
      linux_binary_name:
        description: 'If set, also build a Linux binary and upload it as an artifact'
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: main

      - name: Checkout kurohelper-service
        if: ${{ inputs.use_kurohelperservice != '' }} 
        uses: actions/checkout@v5
        with:
          repository: kuro-helper/kurohelper-service
          ref: ${{ inputs.use_kurohelperservice }}
          path: kurohelperservice

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: main/go.sum

      - name: Link Local Dependencies
        run: |
            cd main
            if [ -d "../kurohelperservice" ]; then
              echo "Linking kurohelperservice to ../kurohelperservice"
              go mod edit -replace kurohelperservice=../kurohelperservice
            fi
            
            echo "Updated go.mod content:"
            cat go.mod

      - name: Build
        run: |
          cd main
          go build -v ./...

      - name: Build Linux binary
        if: ${{ inputs.linux_binary_name != '' }}
        working-directory: main
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
          OUTPUT_NAME: ${{ inputs.linux_binary_name }}
        run: |
          set -euo pipefail
          if [ -f cmd/main.go ]; then
            entrypoint=./cmd/main.go
          elif [ -f main.go ]; then
            entrypoint=.
          else
            echo "::error::Cannot detect Go entrypoint."
            exit 1
          fi
          go build -ldflags="-s -w" -trimpath -o "$OUTPUT_NAME" "$entrypoint"

      - name: Upload Linux binary
        if: ${{ inputs.linux_binary_name != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: main/${{ inputs.linux_binary_name }}
          if-no-files-found: error
          retention-days: 7