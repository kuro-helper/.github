name: Go Deploy

on:
  workflow_call:
    inputs:
      linux_binary_name:
        description: 'Linux 執行檔名稱'
        required: true
        type: string
      systemd_service:
        description: 'systemd --user 服務名稱（不含 .service；空字串則不停/啟服務）'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      VPS_IP: ${{ secrets.VPS_IP }}
      VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_DEPLOY_BASE: ${{ secrets.VPS_DEPLOY_BASE }}
    steps:
      - name: Check Secrets
        run: |
          set -euo pipefail
          missing=0
          for name in VPS_IP VPS_USERNAME VPS_SSH_KEY VPS_DEPLOY_BASE; do
            if [ -z "${!name:-}" ]; then
              echo "::error::缺少必要的 Secret：$name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    env:
      REPO_NAME: ${{ github.event.repository.name }}
      BINARY_NAME: ${{ inputs.linux_binary_name }}
      SERVICE_NAME: ${{ inputs.systemd_service }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: dist

      - name: Stop systemd service
        if: ${{ inputs.systemd_service != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            systemctl --user stop "${{ env.SERVICE_NAME }}.service" || true

      - name: Upload binary to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*"
          target: "${{ secrets.VPS_DEPLOY_BASE }}/${{ env.REPO_NAME }}/"
          strip_components: 1
          overwrite: true

      - name: chmod and start systemd service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            chmod u+x "${{ secrets.VPS_DEPLOY_BASE }}/${{ env.REPO_NAME }}/${{ env.BINARY_NAME }}"
            if [ -n "${{ env.SERVICE_NAME }}" ]; then
              systemctl --user start "${{ env.SERVICE_NAME }}.service"
            fi

      - name: Show deployment info
        run: |
          echo "部署 ref：${{ github.ref }} (${{ github.sha }})"
          echo "已部署至 ${{ secrets.VPS_DEPLOY_BASE }}/${{ env.REPO_NAME }}/"
